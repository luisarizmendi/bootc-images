[Service]
# IdM Server Configuration
Environment="IPA_REALM=BOOTC-EXAMPLE.COM"
Environment="IPA_DOMAIN=bootc-example.com"
Environment="IPA_HOSTNAME=idm.bootc-example.com"

# DNS Configuration
Environment="SETUP_DNS=yes"
Environment="DNS_FORWARDER=8.8.8.8"

# CRITICAL: Change these passwords before deployment!
# For production, use more secure methods (Ignition, vault, OTP, etc.)
Environment="IPA_DS_PASSWORD=ChangeMeDirectoryPassword123!"
Environment="IPA_ADMIN_PASSWORD=ChangeMeAdminPassword123!"
Environment="ENROLL_USERNAME=enrolluser"
Environment="ENROLL_PASSWORD=EnrollDevices123!"