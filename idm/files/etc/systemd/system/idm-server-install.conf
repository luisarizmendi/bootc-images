# Configuration file for IdM Server Installation
# Place this file at: /etc/sysconfig/idm-server-install.conf
# Edit these values for your environment

# Required variables
#IPA_REALM=BOOTC-EXAMPLE.COM
#IPA_DOMAIN=bootc-example.com
#IPA_HOSTNAME=idm.bootc-example.com
IPA_REALM=
IPA_DOMAIN=
IPA_HOSTNAME=

# DNS Configuration
#SETUP_DNS=yes
#DNS_FORWARDER=8.8.8.8
SETUP_DNS=yes
DNS_FORWARDER=8.8.8.8

# CRITICAL: Change these passwords before deployment!
# For production, use more secure methods (Ignition, vault, OTP, etc.)
#IPA_DS_PASSWORD=ChangeMeDirectoryPassword123!
#IPA_ADMIN_PASSWORD=ChangeMeAdminPassword123!
IPA_DS_PASSWORD=
IPA_ADMIN_PASSWORD=

# Enrollment user credentials
#ENROLL_USERNAME=enrolluser
#ENROLL_PASSWORD=EnrollDevices123!
ENROLL_USERNAME=
ENROLL_PASSWORD=

# Optional: Auto-detected if not set
#IPA_IP=192.168.1.10