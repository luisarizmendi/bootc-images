%pre --interpreter=/bin/bash
set -ex

# Detect the first non-removable physical disk
DISK=$(lsblk -ndo NAME,TYPE,RO,RM | awk '$2=="disk" && $3==0 && $4==0 {print "/dev/"$1; exit}')

# calculate 30% of its size to assign to the LVMS VG
TOTAL=$(blockdev --getsize64 "$DISK")
LVMS_SIZE_MIB=$(( TOTAL * 30 / 100 / 1048576 ))
echo "Disk: $DISK (${LVMS_SIZE_MIB} MiB for LVMS)"

cat <<EOF > /tmp/dynamic-partition.ks
clearpart --all
reqpart --add-boot

# SWAP Partition
part swap --size=2048 --ondisk=$(basename $DISK)

# Physical partition for LVMS
part pv.01 --size=10000 --grow --maxsize=${LVMS_SIZE_MIB} --ondisk=$(basename $DISK)
part / --size=1000 --grow --fstype xfs --ondisk=$(basename $DISK)
EOF
%end

%include /tmp/dynamic-partition.ks

%post --log=/var/log/anaconda/post-install.log
set -e

echo "Detecting partitions for LVMS setup..."
LVMS_PART=""
for part in $(lsblk -rno NAME,TYPE | awk '$2=="part"{print $1}'); do
    FSTYPE=$(lsblk -no FSTYPE /dev/$part 2>/dev/null || echo "")
    [ "$FSTYPE" = "swap" ] && continue
    MOUNTPOINT=$(lsblk -no MOUNTPOINT /dev/$part 2>/dev/null || echo "")
    [ "$MOUNTPOINT" = "/" ] && continue
    LVMS_PART="/dev/$part"
    echo "LVMS partition found: $LVMS_PART"
    break
done

if [ -z "$LVMS_PART" ]; then
    echo "WARNING: Could not identify LVMS partition"
    exit 0
fi

echo "Setting up LVMS volume group..."
pvcreate -ff -y "$LVMS_PART"
vgcreate microshift "$LVMS_PART"
vgchange -ay microshift

mkdir -p /etc/microshift
cat > /etc/microshift/lvms.yaml << 'EOF'
socket-name: /run/topolvm/lvmd.sock
device-classes:
  - name: default
    volume-group: microshift
    spare-gb: 0
    default: true
EOF

echo "LVMS configuration completed successfully"

%end
reboot --eject