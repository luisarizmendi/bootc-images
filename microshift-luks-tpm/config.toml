[customizations.installer.kickstart]
contents = '''
network --bootproto=dhcp --device=link --activate --onboot=on
zerombr
user --name=admin --password=$6$nRAle.gs2bcemfTO$n706swfUtMOVfIZ2QngZCQD4OWGoOwWhAYvbzh1zPuMgD1t.Qo6b.3LQPcoVNZnQZ7RjIJi43Jik1VMbRiR.B/ --groups=wheel --iscrypted

%pre --interpreter=/bin/bash
set -ex

# Detect the first non-removable physical disk
DISK=$(lsblk -ndo NAME,TYPE,RO,RM | awk '$2=="disk" && $3==0 && $4==0 {print "/dev/"$1; exit}')

if [ -z "$DISK" ]; then
    echo "ERROR: No suitable disk found!" >&2
    exit 1
fi

# Calculate partition sizes (30% for LVMS, 15% for root minimum)
TOTAL=$(blockdev --getsize64 "$DISK")
LVMS_SIZE_MIB=$(( TOTAL * 30 / 100 / 1048576 ))
ROOT_MIN_SIZE_MIB=$(( TOTAL * 15 / 100 / 1048576 ))

echo "Disk: $DISK"
echo "LVMS VG size: ${LVMS_SIZE_MIB} MiB"
echo "Root minimum: ${ROOT_MIN_SIZE_MIB} MiB"

# Generate dynamic partition configuration
cat <<EOF > /tmp/dynamic-partition.ks
clearpart --all --drives=$(basename $DISK)
reqpart --add-boot
part swap --size=2048 --ondisk=$(basename $DISK) --encrypted --passphrase="redhat"
part pv.01 --size=${LVMS_SIZE_MIB} --ondisk=$(basename $DISK) --encrypted --passphrase="redhat"
part / --size=${ROOT_MIN_SIZE_MIB} --grow --ondisk=$(basename $DISK) --fstype=xfs --encrypted --passphrase="redhat"
EOF

cat /tmp/dynamic-partition.ks
%end

%include /tmp/dynamic-partition.ks

%post --log=/var/log/anaconda/post-install.log --nochroot
set -ex

# TPM2 enrollment MUST happen here (post-install, nochroot) before first boot
PASSPHRASE="redhat"

# Find all LUKS devices
LUKS_DEVS=$(blkid -t TYPE="crypto_LUKS" -o device | sort -u)

# Check if TPM2 is available
if [ ! -e /dev/tpmrm0 ]; then
    echo "WARNING: No TPM2 device found. Skipping enrollment."
else
    echo "TPM2 device found. Enrolling LUKS devices..."
    
    # Enroll each LUKS device with TPM2
    for dev in $LUKS_DEVS; do
        echo "Enrolling $dev with TPM2..."
        echo -n "$PASSPHRASE" | systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=7 "$dev" || {
            echo "WARNING: Failed to enroll $dev"
        }
    done
    
    # Update crypttab in the installed system
    > /mnt/sysroot/etc/crypttab.new
    for dev in $LUKS_DEVS; do
        UUID=$(blkid -s UUID -o value "$dev")
        NAME="luks-$UUID"
        
        # Check if this is a swap partition
        MAPPER="/dev/mapper/$NAME"
        if [ -e "$MAPPER" ] && lsblk -no FSTYPE "$MAPPER" 2>/dev/null | grep -q swap; then
            echo "$NAME UUID=$UUID none tpm2-device=auto,discard,swap" >> /mnt/sysroot/etc/crypttab.new
        else
            echo "$NAME UUID=$UUID none tpm2-device=auto,discard" >> /mnt/sysroot/etc/crypttab.new
        fi
    done
    
    mv /mnt/sysroot/etc/crypttab.new /mnt/sysroot/etc/crypttab
    
    # Regenerate initramfs with TPM2 support
    chroot /mnt/sysroot dracut -f --regenerate-all
    
    echo "TPM2 enrollment completed successfully"
fi
%end

%post --log=/var/log/anaconda/post-install-chroot.log
set -ex

# Detect LVMS LUKS device and set up for first boot
LUKS_DEVS=$(blkid -t TYPE="crypto_LUKS" -o device | sort -u)
ROOT_MAPPER=$(findmnt -n -o SOURCE / | grep '/dev/mapper/' || true)
LVMS_LUKS_DEV=""

for dev in $LUKS_DEVS; do
    UUID=$(blkid -s UUID -o value "$dev")
    MAPPER="/dev/mapper/luks-$UUID"
    TYPE=$(lsblk -no FSTYPE "$MAPPER" 2>/dev/null || echo "")
    
    # Skip swap and root partitions
    [ "$TYPE" = "swap" ] && continue
    [ "$MAPPER" = "$ROOT_MAPPER" ] && continue
    
    LVMS_LUKS_DEV="$dev"
    break
done

# Create LVMS setup script for first boot (if LVMS partition exists)
if [ -n "$LVMS_LUKS_DEV" ]; then
    echo "$LVMS_LUKS_DEV" > /root/lvms-luks-device.txt
    
    mkdir -p /var/lib/microshift-setup
    cat > /var/lib/microshift-setup/setup-lvms.sh << 'EOFSCRIPT'
#!/bin/bash
set -e
LOGFILE="/var/log/microshift-lvms-setup.log"
exec > >(tee -a "$LOGFILE") 2>&1
echo "=== MicroShift LVMS Setup started at $(date) ==="

[ ! -f /root/lvms-luks-device.txt ] && echo "Already completed" && exit 0

LVMS_LUKS_DEV=$(cat /root/lvms-luks-device.txt)
UUID=$(blkid -s UUID -o value "$LVMS_LUKS_DEV")
MAPPER="/dev/mapper/luks-$UUID"

if [ -e "$MAPPER" ] && ! vgs microshift &>/dev/null; then
    echo "Setting up LVMS on $MAPPER..."
    pvcreate -ff -y "$MAPPER"
    vgcreate microshift "$MAPPER"
    vgchange -ay microshift
    
    mkdir -p /etc/microshift
    cat > /etc/microshift/lvms.yaml << 'EOFYAML'
socket-name: /run/topolvm/lvmd.sock
device-classes:
  - name: default
    volume-group: microshift
    spare-gb: 0
    default: true
EOFYAML
    echo "LVMS configured successfully"
fi

rm -f /root/lvms-luks-device.txt
systemctl disable microshift-lvms-setup.service

echo "=== LVMS setup completed at $(date) ==="
EOFSCRIPT

    chmod 700 /var/lib/microshift-setup/setup-lvms.sh
    semanage fcontext -a -t bin_t "/var/lib/microshift-setup(/.*)?" || true
    restorecon -Rv /var/lib/microshift-setup || true
    
    # Create systemd service
    mkdir -p /etc/systemd/system
    cat > /etc/systemd/system/microshift-lvms-setup.service << 'EOFSVC'
[Unit]
Description=MicroShift LVMS Setup
After=local-fs.target
Before=microshift.service
ConditionPathExists=/root/lvms-luks-device.txt

[Service]
Type=oneshot
ExecStart=/var/lib/microshift-setup/setup-lvms.sh
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
EOFSVC

    systemctl enable microshift-lvms-setup.service
fi

%end

reboot --eject
'''