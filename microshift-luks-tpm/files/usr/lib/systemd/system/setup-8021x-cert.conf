# Configuration file for 802.1X certificate setup
# Edit these values for your environment

# Required variables
IPA_SERVER=idm.bootc-example.com
IPA_DOMAIN=bootc-example.com
INTERFACE=enp1s0

# Authentication for IPA enrollment (choose ONE method)
# Method 1: One-Time Password (recommended for new hosts)
IPA_ENROLL_PRINCIPAL=enrolluser
IPA_ENROLL_PASSWORD=EnrollDevices123!

# Method 2: Admin password
#IPA_ENROLL_PASSWORD=AdminPassword

# Method 3: Principal and password
#IPA_ENROLL_PRINCIPAL=admin
#IPA_ENROLL_PASSWORD=Password

# Method 4: Keytab file
#IPA_ENROLL_KEYTAB=/etc/krb5.keytab

# Optional variables (uncomment to override defaults)
#NM_PROFILE=8021x
#CERT_DIR=/etc/pki/tls/certs
#KEY_DIR=/etc/pki/tls/private
#BOOTSTRAP_DIR=/etc/pki/tls/bootstrap
#CA_ANCHOR=/etc/pki/ca-trust/source/anchors/ca.crt
#CA_ALIAS=IPA