# File Monitor Configuration
# Format: PATH|EVENTS|ACTION
#
# PATH supports glob patterns like:
#   /etc/test/*
#   /var/www/html/*.php
#   /home/user/config-*.json
#
# EVENTS:
#   create, delete, modify, move, attrib
#   or "all"
#
# ACTION can use:
#   $MONITOR_PATH
#   $MONITOR_EVENT
#   $MONITOR_FILE
#   $MONITOR_FULLPATH
#
# Examples:
# Example: make changed file executable
#/etc/test/*|all|chmod +x "$MONITOR_FULLPATH"
# Example: restart service when config changes
#/etc/flightctl/*.yaml|modify|systemctl restart flightctl-agent.service
# Example: log every file touched inside /etc/crio
#/etc/crio/*|all|logger "CRIO change: $MONITOR_FULLPATH event=$MONITOR_EVENT"
/etc/crio/openshift-pull-secret|all|systemctl restart microshift
/etc/pki/ca-trust/source/anchors/ca.crt|all|chmod 644 /etc/pki/ca-trust/source/anchors/ca.crt && update-ca-trust extract
/etc/sysconfig/setup-8021x-cert|all|systemctl daemon-reload && systemctl restart setup-8021x-cert.service
/etc/flightctl/config.yaml|all|systemctl restart flightctl-agent.service