# File Monitor Configuration
# Format: PATH|EVENTS|ACTION
#
# PATH: Full path to file or directory to monitor
# EVENTS: Comma-separated list: CREATE, DELETE, MODIFY, MOVE, ATTRIB or "all"
# ACTION: Command or script to execute (can use $MONITOR_* variables)
#
# Available variables in ACTION:
#   $MONITOR_PATH     - The monitored path
#   $MONITOR_EVENT    - The event that occurred
#   $MONITOR_FILE     - The filename
#   $MONITOR_FULLPATH - Full path to the file
#
# Examples:
#/etc/nginx/nginx.conf|MODIFY|/usr/local/bin/reload-nginx.sh
#/etc/nginx/nginx.conf|MODIFY|nginx -t && systemctl reload nginx && logger "Nginx config updated and reloaded"
#/var/www/html|CREATE,DELETE|/usr/local/bin/sync-website.sh
#/home/user/documents|all|logger "Document changed: $MONITOR_FULLPATH"
#/etc/hosts|MODIFY|systemctl restart dnsmasq
/etc/crio/openshift-pull-secret|all|systemctl restart microshift
/etc/pki/ca-trust/source/anchors/ca.crt|all|chmod 644 /etc/pki/ca-trust/source/anchors/ca.crt && update-ca-trust extract
/etc/sysconfig/setup-8021x-cert|all|systemctl restart setup-8021x-cert.service
/etc/flightctl/config.yaml|all|systemctl restart flightctl-agent.service