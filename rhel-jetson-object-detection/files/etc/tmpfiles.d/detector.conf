d  /var/home/detector/.config/containers/systemd                                                               0755 detector detector -
d  /var/home/detector/.local                                           0755 detector detector -
d  /var/home/detector/.local/share                                     0755 detector detector -
d  /var/home/detector/.local/share/containers                          0755 detector detector -
d  /var/home/detector/.local/share/containers/storage                  0755 detector detector -