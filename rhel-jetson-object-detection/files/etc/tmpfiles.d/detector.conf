#################### Home dir ####################
d  /var/home/detector    

#################### Linger — enables systemd user session at boot for rootless Podman ####################
f  /var/lib/systemd/linger/detector                                                                            0644 root     root     -

#################### Quadlets #############################################
# Copy files
C  /var/home/detector/.config/containers/systemd/object-detection-custom-camera-capture.container             0644 detector detector - /usr/share/detector/containers/systemd/object-detection-custom-camera-capture.container
C  /var/home/detector/.config/containers/systemd/object-detection-custom-stream-viewer.container              0644 detector detector - /usr/share/detector/containers/systemd/object-detection-custom-stream-viewer.container
C  /var/home/detector/.config/containers/systemd/object-detection-custom-inference-tensorrt-jetson.container  0644 detector detector - /usr/share/detector/containers/systemd/object-detection-custom-inference-tensorrt-jetson.container

# Systemd user wants dirs (for enabling quadlet units)
d  /var/home/detector/.config/systemd                                                                          0755 detector detector -
d  /var/home/detector/.config/systemd/user                                                                     0755 detector detector -
d  /var/home/detector/.config/systemd/user/default.target.wants                                               0755 detector detector -

# Enable quadlet units (symlinks = systemctl --user enable)
L  /var/home/detector/.config/systemd/user/default.target.wants/object-detection-custom-camera-capture.service             - detector detector - /var/home/detector/.config/containers/systemd/object-detection-custom-camera-capture.container
L  /var/home/detector/.config/systemd/user/default.target.wants/object-detection-custom-stream-viewer.service              - detector detector - /var/home/detector/.config/containers/systemd/object-detection-custom-stream-viewer.container
L  /var/home/detector/.config/systemd/user/default.target.wants/object-detection-custom-inference-tensorrt-jetson.service  - detector detector - /var/home/detector/.config/containers/systemd/object-detection-custom-inference-tensorrt-jetson.container


#################### Models and videos ####################
d  /var/home/detector/models                                                                                   0755 detector detector -
d  /var/home/detector/videos                                                                                   0755 detector detector -

C   /var/home/detector/models/model.onnx                                                                       0644 detector detector - /usr/local/share/models/model.onnx   
C   /var/home/detector/videos/video.mp4                                                                        0644 detector detector - /usr/local/share/videos/video.mp4


#################### Embedded images for rootless ####################

# storage.conf
                                                                                      0700 detector detector -
d  /var/home/detector/.config                                                                                  0755 detector detector -
d  /var/home/detector/.config/containers                                                                       0755 detector detector -
d  /var/home/detector/.config/containers/systemd                                                               0755 detector detector -
