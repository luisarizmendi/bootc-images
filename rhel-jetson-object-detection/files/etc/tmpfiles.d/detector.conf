# Home dir and config structure
d  /var/home/detector                                                                                          0700 detector detector -
d  /var/home/detector/.config                                                                                  0755 detector detector -
d  /var/home/detector/.config/containers                                                                       0755 detector detector -
d  /var/home/detector/.config/containers/systemd                                                               0755 detector detector -

# Quadlets (C = copy only if destination does not exist)
C  /var/home/detector/.config/containers/systemd/object-detection-custom-camera-capture.container             0644 detector detector - /usr/share/detector/containers/systemd/object-detection-custom-camera-capture.container
C  /var/home/detector/.config/containers/systemd/object-detection-custom-stream-viewer.container              0644 detector detector - /usr/share/detector/containers/systemd/object-detection-custom-stream-viewer.container
C  /var/home/detector/.config/containers/systemd/object-detection-custom-inference-tensorrt-jetson.container  0644 detector detector - /usr/share/detector/containers/systemd/object-detection-custom-inference-tensorrt-jetson.container

# storage.conf
C  /var/home/detector/.config/containers/storage.conf                                                         0644 detector detector - /usr/share/detector/containers/storage.conf

# Linger — enables systemd user session at boot for rootless Podman
f  /var/lib/systemd/linger/detector                                                                            0644 root     root     -
