# Field descriptions:
# - type: http, https, or container (required)
# - source: URL for http/https, container image reference for container (required)
# - destination: Local file path where the file will be saved (required)
# - container_file_path: Path to file inside container (required for container type)
# - owner: File owner in user:group format (optional)
# - mode: File permissions in octal format as string, e.g., "0755" (optional)
# - selinux_context: SELinux security context (optional)
# - force: Set to true to force re-download even if file exists (optional, default: false)


