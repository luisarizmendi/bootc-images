<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ready to be enrolled!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #202124;
    }

    main {
      width: min(680px, calc(100% - 3rem));
      padding: 2rem;
      text-align: center;
    }

    .check {
      width: 112px;
      height: 112px;
      margin: 0 auto 1.5rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e8f5e9;
    }

    .check svg {
      width: 76px;
      height: 76px;
      fill: none;
      stroke: #198754;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    p {
      margin: 1rem auto 0;
      max-width: 42rem;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      line-height: 1.55;
      color: #5f6368;
    }

    .status {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.6rem 1rem;
      border-radius: 999px;
      background: #f1f3f4;
      color: #3c4043;
      font-size: 0.95rem;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main>
    <div class="check" aria-label="Ready">
      <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
        <path d="M5 12.5l4.2 4.2L19.5 6.5"></path>
      </svg>
    </div>

    <h1>Ready to be enrolled!</h1>


  </main>
</body>
</html>
